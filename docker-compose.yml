services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: refunddesk
      POSTGRES_PASSWORD: refunddesk
      POSTGRES_DB: refund_desk
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published on the host by default to avoid clashing with a local Postgres.
    # Uncomment to connect with psql/TablePlus on localhost:5433.
    # ports:
    #   - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U refunddesk -d refund_desk']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://refunddesk:refunddesk@db:5432/refund_desk
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin-key}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SEED_ON_START: 'true'
      DEMO_MODE: 'true'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  pgdata:
